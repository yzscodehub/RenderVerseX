name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (DX11/DX12/Vulkan)
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare vcpkg binary cache dir
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
        shell: pwsh

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-

      - name: Build truth (Windows Debug)
        shell: pwsh
        env:
          RVX_NATIVE_ALLOW_SOFTWARE_ADAPTER: "1"
        run: >-
          ./Scripts/run_build_truth.ps1
          -ConfigurePreset win_x64_debug
          -BuildPreset win_x64_debug
          -TestPreset win_x64_debug_unit_lint
          -BuildDir build/win_x64_debug
          -Configuration Debug
          -BaseRef origin/master
          -NativeTestRegex "^NativeRenderLifecycleValidation\.RequiredBackendPresentsResizesAndStops$"
          -RequiredNativeBackend DX12
          -Fresh

      - name: Configure Editor compile-only
        shell: pwsh
        run: cmake --preset win_x64_debug_editor_compile

      - name: Build Editor compile-only
        shell: pwsh
        run: cmake --build --preset win_x64_debug_editor_compile --target RVXEditor

      - name: Record Editor compile evidence
        shell: pwsh
        run: |
          $reportDir = "build/win_x64_debug/BuildTruth"
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          [ordered]@{
            schema = "RVX.M1.EditorCompile"
            schemaVersion = 1
            sourceCommit = (git rev-parse HEAD).Trim()
            configurePreset = "win_x64_debug_editor_compile"
            target = "RVXEditor"
            status = "passed"
          } | ConvertTo-Json | Set-Content "$reportDir/EditorCompile.json" -Encoding utf8

      - name: Upload build-truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-truth-windows-debug
          path: build/win_x64_debug/BuildTruth

  linux:
    name: Linux (Vulkan/OpenGL configure)
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system deps for vcpkg ports
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config xvfb mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev autoconf libtool

      - name: Prepare vcpkg binary cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-

      - name: Build truth (Linux Debug)
        shell: bash
        env:
          RVX_NATIVE_ALLOW_SOFTWARE_ADAPTER: "1"
        run: |
          xvfb-run -a pwsh -NoProfile -File ./Scripts/run_build_truth.ps1 \
            -ConfigurePreset linux_x64_debug \
            -BuildPreset linux_x64_debug \
            -TestPreset linux_x64_debug_unit_lint \
            -BuildDir build/linux_x64_debug \
            -Configuration Debug \
            -BaseRef origin/master \
            -NativeTestRegex '^NativeRenderLifecycleValidation\.RequiredBackendPresentsResizesAndStops$' \
            -RequiredNativeBackend Vulkan \
            -Fresh

      - name: Configure ThreadSanitizer
        run: cmake --preset linux_x64_tsan

      - name: Build ThreadSanitizer stress target
        run: cmake --build --preset linux_x64_tsan --target RenderConcurrencyTSAN

      - name: Run ThreadSanitizer stress
        env:
          TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: |
          mkdir -p build/linux_x64_tsan/BuildTruth
          ctest --preset linux_x64_tsan \
            --output-junit build/linux_x64_tsan/BuildTruth/RenderConcurrencyTSAN.junit.xml

      - name: Upload build-truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-truth-linux-debug
          path: |
            build/linux_x64_debug/BuildTruth
            build/linux_x64_tsan/BuildTruth

  macos:
    name: macOS ARM64 (Metal)
    runs-on: macos-15
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve vcpkg root
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}" >> "$GITHUB_ENV"

      - name: Prepare vcpkg binary cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-macos-arm64-

      - name: Build truth (macOS ARM64 Debug)
        shell: pwsh
        run: >-
          ./Scripts/run_build_truth.ps1
          -ConfigurePreset mac_arm64_debug
          -BuildPreset mac_arm64_debug
          -TestPreset mac_arm64_debug_unit_lint
          -BuildDir build/mac_arm64_debug
          -Configuration Debug
          -BaseRef origin/master
          -NativeTestRegex "^NativeRenderLifecycleValidation\.RequiredBackendPresentsResizesAndStops$"
          -RequiredNativeBackend Metal
          -Fresh

      - name: Upload build-truth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-truth-macos-arm64-debug
          path: build/mac_arm64_debug/BuildTruth

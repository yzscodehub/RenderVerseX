name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  architecture:
    name: Ubuntu Architecture
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, lfs: true}
      - name: Install configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config libvulkan1 mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev autoconf libtool
      - name: Prepare vcpkg cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-architecture-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-architecture-
      - name: Configure architecture graph
        run: cmake --preset linux_x64_debug
      - name: Record dependency-aware validation plan
        run: >-
          python3 Scripts/plan_validation.py
          --root .
          --manifest Docs/module-boundaries.json
          --module-inventory build/linux_x64_debug/Architecture/RVXModuleInventory-Debug.json
          --base-ref origin/master
          --head-ref HEAD
          --mode observation
          --output build/linux_x64_debug/BuildTruth/ValidationSelectionPlan.json
      - name: Run fail-closed architecture suite
        run: >-
          pwsh -NoProfile -File ./Scripts/run_required_suite.ps1
          -ConfigurePreset linux_x64_debug
          -BuildPreset linux_x64_debug
          -TestPreset linux_x64_debug_architecture
          -BuildDir build/linux_x64_debug
          -Configuration Debug
          -BuildTarget RVXValidationArchitecture
          -RequiredLabel lane.architecture
          -BaseRef origin/master
          -SkipConfigure
      - name: Run policy self-tests
        run: python3 -m unittest discover -s Scripts -p "test_*.py" -v
      - name: Verify diff hygiene
        run: git diff --check
      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-linux
          path: build/linux_x64_debug/BuildTruth

  windows-debug:
    name: Windows Debug
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      RVX_NATIVE_ALLOW_SOFTWARE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, lfs: true}
      - name: Prepare vcpkg cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-windows-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-windows-
      - name: Build truth
        shell: pwsh
        run: >-
          ./Scripts/run_build_truth.ps1
          -ConfigurePreset win_x64_debug
          -BuildPreset win_x64_debug
          -LaneTestPresets "win_x64_debug_unit,win_x64_debug_integration,win_x64_debug_native"
          -BuildDir build/win_x64_debug
          -Configuration Debug
          -BaseRef origin/master
          -RequiredNativeBackend DX12
          -Fresh
      - name: Run fail-closed fixed SceneLifecycle smoke
        shell: pwsh
        run: >-
          ./Scripts/run_required_suite.ps1
          -ConfigurePreset win_x64_pr_debug
          -BuildPreset win_x64_pr_debug
          -TestPreset win_x64_pr_debug_smoke
          -BuildDir build/win_x64_pr_debug
          -Configuration Debug
          -BuildTarget RVXValidationSuitePrSmoke
          -RequiredLabel suite.pr-smoke
          -ExpectedTestCount 3
          -RequiredEvidence 'Tests/VisualArtifacts/Debug/RenderVerseSamples/RenderVerseSamplesDX12SceneLifecycleDirect_320x180.ppm;Tests/SampleReports/Debug/RenderVerseSamples/RenderVerseSamplesDX12SceneLifecycleDirect_320x180.json;Tests/StartupTimelines/Debug/RenderVerseSamples/RenderVerseSamplesDX12SceneLifecycleDirect_320x180.json'
          -BaseRef origin/master
          -Fresh
      - name: Upload Windows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-truth-windows-debug
          path: |
            build/win_x64_debug/BuildTruth
            build/win_x64_pr_debug/BuildTruth
            build/win_x64_pr_debug/Tests/VisualArtifacts
            build/win_x64_pr_debug/Tests/SampleReports
            build/win_x64_pr_debug/Tests/StartupTimelines

  linux-debug:
    name: Linux Debug
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
      LIBGL_ALWAYS_SOFTWARE: "1"
      RVX_NATIVE_ALLOW_SOFTWARE_ADAPTER: "1"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, lfs: true}
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev autoconf libtool \
            fonts-dejavu-core fonts-noto-cjk
      - name: Select and verify Lavapipe
        shell: bash
        run: |
          mapfile -t manifests < <(dpkg-query -L mesa-vulkan-drivers | awk '/\/lvp_icd[^/]*\.json$/ { print }' | sort -u)
          if [[ "${#manifests[@]}" -ne 1 || ! -f "${manifests[0]}" ]]; then
            echo "::error::Expected exactly one Lavapipe ICD manifest"
            exit 1
          fi
          echo "VK_DRIVER_FILES=${manifests[0]}" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=${manifests[0]}" >> "$GITHUB_ENV"
          xvfb-run -a vulkaninfo --summary
      - name: Prepare vcpkg cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-linux-
      - name: Build truth
        shell: bash
        run: |
          xvfb-run -a pwsh -NoProfile -File ./Scripts/run_build_truth.ps1 \
            -ConfigurePreset linux_x64_debug \
            -BuildPreset linux_x64_debug \
            -LaneTestPresets 'linux_x64_debug_unit,linux_x64_debug_integration,linux_x64_debug_native' \
            -BuildDir build/linux_x64_debug \
            -Configuration Debug \
            -BaseRef origin/master \
            -RequiredNativeBackend Vulkan \
            -Fresh
      - name: Run fail-closed fixed SceneLifecycle smoke
        run: >-
          xvfb-run -a pwsh -NoProfile -File ./Scripts/run_required_suite.ps1
          -ConfigurePreset linux_x64_pr_debug
          -BuildPreset linux_x64_pr_debug
          -TestPreset linux_x64_pr_debug_smoke
          -BuildDir build/linux_x64_pr_debug
          -Configuration Debug
          -BuildTarget RVXValidationSuitePrSmoke
          -RequiredLabel suite.pr-smoke
          -ExpectedTestCount 3
          -RequiredEvidence 'Tests/VisualArtifacts/Debug/RenderVerseSamples/RenderVerseSamplesVulkanSceneLifecycleDirect_320x180.ppm;Tests/SampleReports/Debug/RenderVerseSamples/RenderVerseSamplesVulkanSceneLifecycleDirect_320x180.json;Tests/StartupTimelines/Debug/RenderVerseSamples/RenderVerseSamplesVulkanSceneLifecycleDirect_320x180.json'
          -BaseRef origin/master
          -Fresh
      - name: Upload Linux evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-truth-linux-debug
          path: |
            build/linux_x64_debug/BuildTruth
            build/linux_x64_pr_debug/BuildTruth
            build/linux_x64_pr_debug/Tests/VisualArtifacts
            build/linux_x64_pr_debug/Tests/SampleReports
            build/linux_x64_pr_debug/Tests/StartupTimelines

  linux-tsan:
    name: Linux TSAN
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, lfs: true}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config libvulkan1 mesa-vulkan-drivers \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev autoconf libtool
      - name: Prepare vcpkg cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-linux-tsan-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-linux-tsan-
      - name: Configure TSAN
        run: cmake --preset linux_x64_tsan
      - name: Run fail-closed focused concurrency validation
        env:
          TSAN_OPTIONS: halt_on_error=1:abort_on_error=1
        run: >-
          pwsh -NoProfile -File ./Scripts/run_required_suite.ps1
          -ConfigurePreset linux_x64_tsan
          -BuildPreset linux_x64_tsan
          -TestPreset linux_x64_tsan
          -BuildDir build/linux_x64_tsan
          -Configuration Debug
          -BuildTarget RenderConcurrencyTSAN
          -RequiredLabel lane.integration
          -BaseRef origin/master
          -SkipConfigure
      - name: Upload TSAN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tsan
          path: build/linux_x64_tsan/BuildTruth

  macos-arm64:
    name: macOS ARM64
    runs-on: macos-15
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, lfs: true}
      - name: Resolve vcpkg root
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}" >> "$GITHUB_ENV"
      - name: Prepare vcpkg cache
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-macos-arm64-
      - name: Build truth
        shell: pwsh
        run: >-
          ./Scripts/run_build_truth.ps1
          -ConfigurePreset mac_arm64_debug
          -BuildPreset mac_arm64_debug
          -LaneTestPresets "mac_arm64_debug_unit,mac_arm64_debug_integration,mac_arm64_debug_native"
          -BuildDir build/mac_arm64_debug
          -Configuration Debug
          -BaseRef origin/master
          -RequiredNativeBackend Metal
          -Fresh
      - name: Run fail-closed fixed SceneLifecycle smoke
        shell: pwsh
        run: >-
          ./Scripts/run_required_suite.ps1
          -ConfigurePreset mac_arm64_pr_debug
          -BuildPreset mac_arm64_pr_debug
          -TestPreset mac_arm64_pr_debug_smoke
          -BuildDir build/mac_arm64_pr_debug
          -Configuration Debug
          -BuildTarget RVXValidationSuitePrSmoke
          -RequiredLabel suite.pr-smoke
          -ExpectedTestCount 3
          -RequiredEvidence 'Tests/VisualArtifacts/Debug/RenderVerseSamples/RenderVerseSamplesMetalSceneLifecycleDirect_320x180.ppm;Tests/SampleReports/Debug/RenderVerseSamples/RenderVerseSamplesMetalSceneLifecycleDirect_320x180.json;Tests/StartupTimelines/Debug/RenderVerseSamples/RenderVerseSamplesMetalSceneLifecycleDirect_320x180.json'
          -BaseRef origin/master
          -Fresh
      - name: Upload macOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-truth-macos-arm64-debug
          path: |
            build/mac_arm64_debug/BuildTruth
            build/mac_arm64_pr_debug/BuildTruth
            build/mac_arm64_pr_debug/Tests/VisualArtifacts
            build/mac_arm64_pr_debug/Tests/SampleReports
            build/mac_arm64_pr_debug/Tests/StartupTimelines

  shipping:
    name: Shipping (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: Windows, runner: windows-2022, vcpkg_root: 'C:/vcpkg', host_preset: win_x64_shipping_host_release, shipping_preset: win_x64_shipping_release, test_preset: win_x64_shipping_release_shipping, build_dir: build/win_x64_shipping_release}
          - {platform: Linux, runner: ubuntu-24.04, vcpkg_root: /usr/local/share/vcpkg, host_preset: linux_x64_shipping_host_release, shipping_preset: linux_x64_shipping_release, test_preset: linux_x64_shipping_release_shipping, build_dir: build/linux_x64_shipping_release}
          - {platform: macOS, runner: macos-15, vcpkg_root: /usr/local/share/vcpkg, host_preset: mac_arm64_shipping_host_release, shipping_preset: mac_arm64_shipping_release, test_preset: mac_arm64_shipping_release_shipping, build_dir: build/mac_arm64_shipping_release}
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_ROOT: ${{ matrix.vcpkg_root }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, lfs: true}
      - name: Resolve macOS vcpkg root
        if: runner.os == 'macOS'
        run: echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}" >> "$GITHUB_ENV"
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev autoconf libtool fonts-dejavu-core fonts-noto-cjk
          mapfile -t manifests < <(dpkg-query -L mesa-vulkan-drivers | awk '/\/lvp_icd[^/]*\.json$/ { print }' | sort -u)
          test "${#manifests[@]}" -eq 1
          echo "VK_DRIVER_FILES=${manifests[0]}" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=${manifests[0]}" >> "$GITHUB_ENV"
          echo "RVX_NATIVE_ALLOW_SOFTWARE_ADAPTER=1" >> "$GITHUB_ENV"
      - name: Enable explicit Windows software-adapter fallback
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'RVX_NATIVE_ALLOW_SOFTWARE_ADAPTER=1'
      - name: Prepare vcpkg cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-shipping-${{ matrix.platform }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-shipping-${{ matrix.platform }}-
      - name: Configure host cooker
        run: cmake --preset ${{ matrix.host_preset }}
      - name: Build host cooker
        run: cmake --build --preset ${{ matrix.host_preset }} --parallel 3
      - name: Run fail-closed Shipping validation
        if: runner.os != 'Linux'
        shell: pwsh
        run: >-
          ./Scripts/run_required_suite.ps1
          -ConfigurePreset ${{ matrix.shipping_preset }}
          -BuildPreset ${{ matrix.shipping_preset }}
          -TestPreset ${{ matrix.test_preset }}
          -BuildDir ${{ matrix.build_dir }}
          -Configuration Release
          -BuildTarget RVXValidationSuiteRequiredShipping
          -RequiredLabel suite.required-shipping
          -ExpectedTestCount 5
          -RequiredEvidence 'Tests/Shipping/ShippingFixtures/Release/shipping-fixture-receipt.json;Tests/Shipping/ShippingFixtures/Release/shipping-smoke.json'
          -BaseRef origin/master
          -Fresh
      - name: Run fail-closed Linux Shipping validation
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a pwsh -NoProfile -File ./Scripts/run_required_suite.ps1
          -ConfigurePreset ${{ matrix.shipping_preset }}
          -BuildPreset ${{ matrix.shipping_preset }}
          -TestPreset ${{ matrix.test_preset }}
          -BuildDir ${{ matrix.build_dir }}
          -Configuration Release
          -BuildTarget RVXValidationSuiteRequiredShipping
          -RequiredLabel suite.required-shipping
          -ExpectedTestCount 5
          -RequiredEvidence 'Tests/Shipping/ShippingFixtures/Release/shipping-fixture-receipt.json;Tests/Shipping/ShippingFixtures/Release/shipping-smoke.json'
          -BaseRef origin/master
          -Fresh
      - name: Upload Shipping evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipping-${{ matrix.platform }}
          path: |
            build/*shipping_release/BuildTruth
            build/*shipping_release/Tests/Shipping/ShippingFixtures
          if-no-files-found: error

  pr-verdict:
    name: PR Verdict
    if: always()
    needs: [architecture, windows-debug, linux-debug, linux-tsan, macos-arm64, shipping]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every PR gate
        env:
          ARCHITECTURE: ${{ needs.architecture.result }}
          WINDOWS_DEBUG: ${{ needs.windows-debug.result }}
          LINUX_DEBUG: ${{ needs.linux-debug.result }}
          LINUX_TSAN: ${{ needs.linux-tsan.result }}
          MACOS_ARM64: ${{ needs.macos-arm64.result }}
          SHIPPING: ${{ needs.shipping.result }}
        run: |
          for result in "$ARCHITECTURE" "$WINDOWS_DEBUG" "$LINUX_DEBUG" "$LINUX_TSAN" "$MACOS_ARM64" "$SHIPPING"; do
            test "$result" = success || exit 1
          done
